patch:
  ascii_composer:
    good_old_caps_lock: true
    switch_key: {Caps_Lock: clear, Control_L: noop, Control_R: noop, Eisu_toggle: noop, Shift_L: set_ascii_mode, Shift_R: unset_ascii_mode, Control+space: clear}

  schema_list:
    - {schema: xf}

  switcher:
    caption: "〔方案選單〕"
    hotkeys: ["Control+grave"]

  key_binder/bindings:
    - { when: has_menu, accept: Control+k, send: Page_Up }
    - { when: has_menu, accept: Control+j, send: Page_Down }
    - { when: has_menu, accept: Control+h, send: Up }
    - { when: has_menu, accept: Control+l, send: Down}
    - { when: always, accept: Control+space, toggle: ascii_mode }

